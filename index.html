    <title>MediServe — Precision Healthcare Systems</title>
    <script>
      // Early suppression of Clerk development instance warnings before clerk-js bootstrap
      (function() {
        var w = console.warn;
        console.warn = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (
            arguments[0].indexOf('Clerk has been loaded with development keys') !== -1 ||
            arguments[0].indexOf('clerk.com/docs/deployments/overview') !== -1
          )) {
            return;
          }
          return w.apply(console, arguments);
        };
      })();
    </script>
